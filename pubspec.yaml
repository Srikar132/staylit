name: staylit
description: "Staylit is a smart focus and study companion designed to help users enter a distraction-free study mode."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cloud_firestore: ^6.1.1
  firebase_analytics: ^12.1.0
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  google_sign_in: ^6.2.1
  riverpod: ^3.0.3
  audioplayers: ^6.0.0
  go_router: ^17.0.1
  lottie: ^3.3.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  crypto: ^3.0.3
  installed_apps: ^1.4.0
  
  # Voice Assistant Dependencies
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icons/icon.png"
  android: "launcher_icon"
  ios: false
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/icon_monochrome.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#111113"
  image: assets/splash/splash_logo.png
  image_dark: assets/splash/splash_logo.png
  android: true
  ios: false
  web: false
  android_12:
    image: assets/splash/splash_logo.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image_dark: assets/splash/splash_logo.png
    color_dark: "#111113"
    icon_background_color_dark: "#111113"
